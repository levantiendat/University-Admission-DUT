version: "3.1"
stories:

  # ====== Basic Conversation Tests ======
  - story: Test greeting and farewell flow
    steps:
      - user: "xin chào"
        intent: greet
      - action: utter_greet
      - user: "tạm biệt"
        intent: goodbye
      - action: utter_goodbye

  - story: Test bot challenge response
    steps:
      - user: "bạn là người hay máy?"
        intent: bot_challenge
      - action: utter_iamabot

  - story: Test thank you response
    steps:
      - user: "cảm ơn bạn nhiều"
        intent: thank
      - action: utter_thank

  - story: Test iamabot response
    steps:
      - user: "bạn là ai vậy?"
        intent: iamabot
      - action: utter_iamabot

  # ====== Smalltalk Tests ======
  - story: Test smalltalk how are you
    steps:
      - user: "bạn khỏe không?"
        intent: smalltalk_how_are_you
      - action: utter_smalltalk_how_are_you

  - story: Test smalltalk bot age
    steps:
      - user: "bạn bao nhiêu tuổi?"
        intent: smalltalk_bot_age
      - action: utter_smalltalk_bot_age

  - story: Test smalltalk who created you
    steps:
      - user: "ai tạo ra bạn?"
        intent: smalltalk_who_created_you
      - action: utter_smalltalk_who_created_you

  - story: Test smalltalk bot capabilities
    steps:
      - user: "bạn có thể làm gì?"
        intent: smalltalk_bot_capabilities
      - action: utter_smalltalk_bot_capabilities

