        intent: ask_cutoff_score
        entities:
          - major: "CNTT AI"
          - method: "đánh giá tư duy"
      - action: action_cutoff_score

  - story: Test cutoff score without specifics
    steps:
      - user: "cho mình xin điểm chuẩn"
        intent: ask_cutoff_score
      - action: action_cutoff_score

