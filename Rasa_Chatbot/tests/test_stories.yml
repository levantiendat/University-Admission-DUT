      - action: action_check_major_admission_with_subject_scores

  # ====== Multi-turn Conversation Tests ======
  - story: Test multi-turn conversation about CNTT
    steps:
      - user: "xin chào"
        intent: greet
      - action: utter_greet
      - user: "cho tôi biết về ngành CNTT"
        intent: ask_major_info
      - action: utter_major_info
      - user: "có mấy chuyên ngành?"
        intent: ask_faq_detail_specialized
      - action: utter_faq_detail_specialized
      - user: "điểm chuẩn là bao nhiêu?"
        intent: ask_cutoff_score
      - action: action_cutoff_score
      - user: "cảm ơn"
        intent: thank
      - action: utter_thank

  - story: Test multi-turn conversation about admission
    steps:
      - user: "chào bạn"
        intent: greet
      - action: utter_greet
      - user: "các phương thức xét tuyển là gì?"
        intent: ask_admission_method_uni
      - action: utter_admission_methods_uni
      - user: "cntt có xét tuyển bằng điểm thi tốt nghiệp không?"
        intent: ask_if_major_accepts_method
        entities:
          - major: "cntt"
          - method: "điểm thi tốt nghiệp"
      - action: action_ask_if_major_accepts_method
      - user: "điểm chuẩn là bao nhiêu?"
        intent: ask_cutoff_score
        entities:
          - major: "cntt"
          - method: "điểm thi tốt nghiệp"
      - action: action_cutoff_score
      - user: "cảm ơn, tạm biệt"
        intent: goodbye
      - action: utter_goodbye

  - story: Test fallback response
    steps:
      - user: "xin chào"
        intent: greet
      - action: utter_greet
      - user: "bạn có nhảy được không?"
        intent: nlu_fallback
      - action: action_default_fallback

  - story: Test affirm and deny
    steps:
      - user: "chào bạn"
        intent: greet
      - action: utter_greet
      - user: "CNTT có mấy chuyên ngành?"
        intent: ask_faq_detail_specialized
      - action: utter_faq_detail_specialized
      - user: "có đúng không?"
        intent: affirm
      - action: utter_faq_detail_specialized
      - user: "không đúng"
        intent: deny
      - action: action_default_fallback