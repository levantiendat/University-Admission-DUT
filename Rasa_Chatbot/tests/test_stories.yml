          - faculty: "công nghệ thông tin"
      - action: action_suggest_major_by_score_with_method_and_faculty

  - story: Test score calculation
    steps:
      - user: "em đạt được điểm môn toán là 8.5, môn vật lý là 7.5, môn hóa học là 6.5, vậy điểm của em là bao nhiêu?"
        intent: ask_calculate_score
        entities:
          - subject: "toán"
          - subject: "vật lý"
          - subject: "hóa học"
