  # ====== Advanced Features Tests ======
  - story: Test career guidance
    steps:
      - user: "tôi nên học ngành gì phù hợp với sở thích?"
        intent: ask_career_guidance
      - action: action_suggest_majors_by_strengths

  - story: Test provide student interests
    steps:
      - user: "tôi thích làm việc với máy tính và giải quyết vấn đề"
        intent: provide_student_interests
        entities:
          - student_interests: "làm việc với máy tính"
          - student_interests: "giải quyết vấn đề"
      - action: action_suggest_majors_by_strengths

