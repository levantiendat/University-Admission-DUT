  examples: |
    - em đạt được điểm môn [toán](subject) là [8.5], môn [vật lý](subject) là [7.5], môn [hóa học](subject) là [6.5], vậy điểm của em là bao nhiêu?
    - em thi kỳ thi vừa rồi đạt điểm là [toán](subject) : [8.5], [vật lý](subject) : [7.5], [hóa học](subject) : [6.5], [ngữ văn](subject) : [5.75]
    - em có điểm môn [toán](subject) là [8.5], môn [tin học](subject) là [10], môn [hóa học](subject) là [6.5], môn [ngữ văn](subject) là [5.75]
    - giúp em tính điểm với [toán](subject) [9], [lý](subject) [8], [hóa](subject) [7.5]
    - điểm của em là [toán](subject) [8], [tiếng anh](subject) [9], [lý](subject) [7.5] thì tổng điểm là bao nhiêu?

